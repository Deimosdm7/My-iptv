name: Atualizar lista FAST unificada

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-fast-unificada
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Verificar atualização do repositório oficial
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST="$(curl -fsSL https://api.github.com/repos/BuddyChewChew/app-m3u-generator/commits/main | jq -r .sha)"
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Não foi possível obter o commit oficial."
            exit 1
          fi
          PREVIOUS=""
          if [ -f upstream-fast-commit.txt ]; then
            PREVIOUS="$(cat upstream-fast-commit.txt)"
          fi
          echo "$LATEST" > latest-upstream.txt
          if [ "$LATEST" = "$PREVIOUS" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "O repositório oficial não mudou."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Nova versão oficial detectada: $LATEST"
          fi

      - name: Preparar Python
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência
        if: steps.upstream.outputs.changed == 'true'
        run: python -m pip install requests

      - name: Gerar lista unificada
        if: steps.upstream.outputs.changed == 'true'
        run: python scripts/update_fast_playlist.py

      - name: Registrar versão oficial e salvar alterações
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mv latest-upstream.txt upstream-fast-commit.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fast_streaming_unificada.m3u upstream-fast-commit.txt
          if git diff --cached --quiet; then
            echo "Sem alterações no conteúdo da playlist."
            exit 0
          fi
          git commit -m "Atualiza lista FAST a partir do repositório oficial"
          git push
