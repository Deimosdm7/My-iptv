name: Sync My Live TV + Pluto BR

on:
  push:
    paths:
      - ".github/workflows/build-my-live-tv-plus-pluto.yml"
      - "my_live_tv.m3u"
      - "news_opinion_custom.m3u"
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build combined playlist
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o my_live_tv_source.m3u "https://raw.githubusercontent.com/Deimosdm7/My-iptv/main/my_live_tv.m3u"
          curl -L --fail --retry 3 --retry-delay 5 -o pluto_br.m3u "https://raw.githubusercontent.com/BuddyChewChew/pluto/refs/heads/main/pluto_br.m3u"
          curl -L --fail --retry 3 --retry-delay 5 -o pluto_all.m3u "https://raw.githubusercontent.com/BuddyChewChew/pluto/refs/heads/main/pluto_all.m3u"

          python3 - <<'PY'
          import re
          from pathlib import Path

          def parse_blocks(path):
              lines = Path(path).read_text(encoding="utf-8", errors="replace").splitlines()
              blocks = []
              current = []
              for line in lines:
                  if line.startswith("#EXTINF:"):
                      if current:
                          blocks.append(current)
                      current = [line]
                  elif current:
                      current.append(line)
              if current:
                  blocks.append(current)
              return blocks

          original_groups = {
              "RTP 1": "TV Portuguesa",
              "TVI": "TV Portuguesa",
          }

          original_news = {
              "CNBC", "CNN Brasil", "CNN Portugal", "RTP Notícias",
              "Newsmax Español", "FOX Channel", "RAI News", "SIC Notícias",
              "Euronews EN", "Sky News", "CNN International", "NBC News Now",
              "Noticias Telemundo Ahora", "Digi24", "Antena 3",
          }

          def normalize_original(block):
              extinf = block[0]
              name = extinf.rsplit(",", 1)[-1].strip()
              group = original_groups.get(name, "News Opinion" if name in original_news else None)
              if group:
                  if 'group-title="' in extinf:
                      extinf = re.sub(r'group-title="[^"]*"', f'group-title="{group}"', extinf)
                  else:
                      extinf = extinf.replace("#EXTINF:", f'#EXTINF:-1 group-title="{group}" ', 1)
                  block = [extinf] + block[1:]
              return block

          output = ["#EXTM3U\n"]
          seen = set()

          # Manual News Opinion channels are added first so automatic source
          # updates cannot remove or replace them.
          for block in parse_blocks("news_opinion_custom.m3u"):
              block = normalize_original(block)
              extinf = block[0]
              id_match = re.search(r'tvg-id="([^"]+)"', extinf)
              name = extinf.rsplit(",", 1)[-1].strip()
              key = ("manual", id_match.group(1) if id_match else name.casefold(), name.casefold())
              if key in seen:
                  continue
              seen.add(key)
              output.append(extinf.rstrip() + "\n")
              output.extend(line.rstrip() + "\n" for line in block[1:])

          for block in parse_blocks("my_live_tv_source.m3u"):
              block = normalize_original(block)
              extinf = block[0]
              id_match = re.search(r'tvg-id="([^"]+)"', extinf)
              name = extinf.rsplit(",", 1)[-1].strip()
              key = ("channel", id_match.group(1) if id_match else name.casefold(), name.casefold())
              if key in seen:
                  continue
              seen.add(key)
              output.append(extinf.rstrip() + "\n")
              output.extend(line.rstrip() + "\n" for line in block[1:])

          # Keep the normal Pluto BR channels.
          for block in parse_blocks("pluto_br.m3u"):
              extinf = block[0]
              id_match = re.search(r'tvg-id="([^"]+)"', extinf)
              name = extinf.rsplit(",", 1)[-1].strip()
              key = ("pluto", id_match.group(1) if id_match else name.casefold(), name.casefold())
              if key in seen:
                  continue
              seen.add(key)
              output.append(extinf.rstrip() + "\n")
              output.extend(line.rstrip() + "\n" for line in block[1:])

          # Add ALL news channels found in Pluto's international list.
          # Pluto may use different language/category labels, so classify
          # common news group names and news keywords as News Opinion.
          news_groups = {
              "notícias", "noticias", "news", "news & opinion", "news opinion",
              "news + opinion", "actualités", "nachrichten", "notizie",
              "noticias y opinión", "noticias y opinion"
          }
          news_keywords = re.compile(
              r'\b(news|noticias|notícia|noticias y opinión|notizie|nachrichten|'
              r'actualités|euronews|cnbc|cnn|fox news|bbc news|sky news|'
              r'al jazeera|msnbc|abc news|cbs news|nbc news|reuters|'
              r'bloomberg|telemundo|univision)\b', re.I
          )

          for block in parse_blocks("pluto_all.m3u"):
              extinf = block[0]
              name = extinf.rsplit(",", 1)[-1].strip()
              pluto_group = re.search(r'group-title="([^"]*)"', extinf)
              group = pluto_group.group(1).strip().casefold() if pluto_group else ""
              if group not in news_groups and not news_keywords.search(name):
                  continue

              extinf = re.sub(
                  r'group-title="[^"]*"',
                  'group-title="News Opinion"',
                  extinf
              )
              if 'group-title="' not in extinf:
                  extinf = extinf.replace(
                      "#EXTINF:",
                      '#EXTINF:-1 group-title="News Opinion" ',
                      1
                  )

              id_match = re.search(r'tvg-id="([^"]+)"', extinf)
              key = ("pluto-news", id_match.group(1) if id_match else name.casefold(), name.casefold())
              if key in seen:
                  continue
              seen.add(key)
              output.append(extinf.rstrip() + "\n")
              output.extend(line.rstrip() + "\n" for line in block[1:])

          Path("my_live_tv_plus_pluto.m3u").write_text("".join(output), encoding="utf-8")
          print(f"Built {len(seen)} channels: manual + original + Pluto BR.")
          PY

          rm -f my_live_tv_source.m3u pluto_br.m3u pluto_all.m3u

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my_live_tv_plus_pluto.m3u
          if git diff --cached --quiet; then
            echo "No playlist changes."
            exit 0
          fi
          git commit -m "Sync My Live TV with Pluto BR and preserve Pluto news category"
          git push
