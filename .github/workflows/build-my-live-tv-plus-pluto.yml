name: Build My Live TV + Pluto News

on:
  push:
    paths:
      - ".github/workflows/build-my-live-tv-plus-pluto.yml"
      - "my_live_tv.m3u"
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and filter news channels
        run: |
          set -e
          curl -L --fail --retry 3 -o my_live_tv_source.m3u "https://raw.githubusercontent.com/Deimosdm7/My-iptv/main/my_live_tv.m3u"
          curl -L --fail --retry 3 -o pluto_all.m3u "https://raw.githubusercontent.com/BuddyChewChew/pluto/refs/heads/main/pluto_all.m3u"
          python3 - <<'PY'
          import re
          from pathlib import Path

          # Keep news networks and dedicated news channels; exclude general entertainment channels.
          news = re.compile(
              r"news|not[ií]cias|noticias|cnn|euronews|sky\s*news|rai\s*news|fox\s*channel",
              re.IGNORECASE
          )

          output = ["#EXTM3U\n"]
          for filename in ("my_live_tv_source.m3u", "pluto_all.m3u"):
              lines = Path(filename).read_text(encoding="utf-8", errors="replace").splitlines(keepends=True)
              blocks = []
              current = []
              for line in lines:
                  if line.lstrip().startswith("#EXTINF:"):
                      if current:
                          blocks.append(current)
                      current = [line]
                  elif current:
                      current.append(line)
              if current:
                  blocks.append(current)

              for block in blocks:
                  if news.search(block[0]):
                      output.extend(block)

          Path("my_live_tv_plus_pluto.m3u").write_text("".join(output), encoding="utf-8")
          PY
          rm -f my_live_tv_source.m3u pluto_all.m3u

      - name: Commit filtered playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my_live_tv_plus_pluto.m3u
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Keep only news channels in My Live TV + Pluto"
          git push
