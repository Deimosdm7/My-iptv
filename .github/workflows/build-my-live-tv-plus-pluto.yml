name: Sync Pluto News Opinion

on:
  push:
    paths:
      - ".github/workflows/build-my-live-tv-plus-pluto.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Pluto playlist and keep news and opinion channels only
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o pluto_all.m3u "https://raw.githubusercontent.com/BuddyChewChew/pluto/refs/heads/main/pluto_all.m3u"
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("pluto_all.m3u").read_text(encoding="utf-8", errors="replace").splitlines()
          include = re.compile(
              r"news|not[ií]cias|euronews|bloomberg|weather|cnn|cbs en español|"
              r"the first$|blaze live|america'?s voice|oan plus|salem news|"
              r"livenow|live now|today all day|record news|jovem pan|bm&c|fox local",
              re.IGNORECASE
          )
          exclude = re.compile(r"fox sports|cbs sports|the first 48|cnn originals", re.IGNORECASE)

          blocks = []
          current = []
          for line in source:
              if line.startswith("#EXTINF:"):
                  if current:
                      blocks.append(current)
                  current = [line]
              elif current:
                  current.append(line)
          if current:
              blocks.append(current)

          output = ["#EXTM3U\n"]
          seen = set()
          for block in blocks:
              extinf = block[0]
              name = extinf.rsplit(",", 1)[-1].strip()
              if not include.search(name) or exclude.search(name):
                  continue
              if not any(line.startswith("http") for line in block[1:]):
                  continue

              id_match = re.search(r'tvg-id="([^"]+)"', extinf)
              key = ((id_match.group(1) if id_match else name), name.casefold())
              if key in seen:
                  continue
              seen.add(key)

              extinf = re.sub(r'group-title="[^"]*"', 'group-title="News Opinion"', extinf)
              if 'group-title=' not in extinf:
                  extinf = extinf.replace("#EXTINF:", '#EXTINF:-1 group-title="News Opinion" ', 1)
              output.append(extinf.rstrip("\r\n") + "\n")
              output.extend(line.rstrip("\r\n") + "\n" for line in block[1:])

          if len(output) == 1:
              raise SystemExit("No news/opinion channels were found; keeping the existing playlist unchanged.")

          Path("my_live_tv_plus_pluto.m3u").write_text("".join(output), encoding="utf-8")
          print(f"Prepared {len(seen)} news/opinion channels in News Opinion.")
          PY
          rm -f pluto_all.m3u

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my_live_tv_plus_pluto.m3u
          if git diff --cached --quiet; then
            echo "No changes in Pluto news/opinion channels."
            exit 0
          fi
          git commit -m "Sync Pluto News Opinion playlist"
          git push
